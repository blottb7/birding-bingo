name: Publish Birding Bingo

on:
  push:
    branches: [main]
    paths:
      - "outputs/index.html"
      - "outputs/app.js"
      - "outputs/birds.js"
      - "outputs/terms_of_use.txt"
      - "outputs/recommended_citation.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir site
          cp outputs/index.html outputs/app.js outputs/birds.js outputs/terms_of_use.txt outputs/recommended_citation.txt site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
